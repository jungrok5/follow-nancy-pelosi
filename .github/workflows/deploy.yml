name: Deploy to Cloudflare Workers

# 1) 코드 푸시 → 재배포
# 2) 30분마다 → 공시 스냅샷을 새로 굽고 재배포
#    (연도별 ZIP은 평일 하루 한 번꼴로만 갱신되지만, 파이프라인이 사무처 라이브 검색도
#     함께 조회하므로 신규 공시를 게시 후 30분 안에 잡는다)
# 3) 수동 실행
#
# 필요한 시크릿: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (스케줄 트리거는 기본 브랜치에 이 파일이 있어야 동작합니다)
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # secrets 컨텍스트는 step의 if에서 못 쓰므로 env로 내려받는다.
    env:
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 하원 사무처 공시를 파싱해 public/data/snapshot.json 생성.
      # (Workers 런타임에서는 PDF 파싱이 불가능하므로 여기서 미리 굽는다)
      - name: 공시 스냅샷 빌드
        run: npm run build:data

      - name: KV에 스냅샷 적재 (KV_NAMESPACE_ID 시크릿이 있을 때만)
        if: env.KV_NAMESPACE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put "dataset:pelosi-nancy" \
            --path public/data/snapshot.json \
            --namespace-id "$KV_NAMESPACE_ID" --remote

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
