name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 문법 검사
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done
      - name: 파이프라인 스모크 테스트 (공시 원본 실제 호출)
        run: node scripts/smoke-test.js
